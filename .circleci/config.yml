version: 2.1
orbs:
  node: circleci/node@5.0.2
  codecov: codecov/codecov@3.1.1
jobs:
  test:
    executor: node/default
    steps:
      - checkout
      - node/install:
          install-yarn: false
          node-version: '26.13'
      - node/install-packages:
          cache-path: ~/hack-party/node_modules
          override-ci-command: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - codecov/upload
workflows:
  node-tests:
    jobs:
      - test
