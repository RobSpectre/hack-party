version: 2.1
orbs:
  codecov: codecov/codecov@3.1.1
jobs:
  test:
    docker:
      - image: cimg/node:26.13
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - codecov/upload
workflows:
  node-tests:
    jobs:
      - test
