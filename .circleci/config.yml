version: 2.1
orbs:
  codecov: codecov/codecov@6.1.0
jobs:
  test:
    docker:
      - image: cimg/node:26.13
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - codecov/upload:
          files: coverage/coverage-final.json
workflows:
  node-tests:
    jobs:
      - test
